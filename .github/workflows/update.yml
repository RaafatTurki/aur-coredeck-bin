name: Update AUR package

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-aur
  cancel-in-progress: false

env:
  AUR_PKG: coredeck-bin
  GIT_NAME: Raafat Turki
  GIT_EMAIL: raafat.turki@proton.me

jobs:
  check:
    # cheap new version check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Look for a new upstream release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(./check.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"


  update:
    # pushes to aur, commit to gh repo
    needs: check
    if: needs.check.outputs.version != ''
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install tools
        run: |
          pacman -Syu --noconfirm git openssh jq pacman-contrib
          useradd -m builder

      - uses: actions/checkout@v4

      - name: Bump version and verify build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env GH_TOKEN="$GH_TOKEN" ./update.sh

      - name: Show pending change (dry run)
        if: vars.AUR_PUSH != 'true'
        run: git --no-pager diff PKGBUILD

      - name: Publish to AUR, then commit here
        if: vars.AUR_PUSH == 'true'
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if git diff --quiet -- PKGBUILD; then
            echo "nothing to publish"; exit 0
          fi
          ver=$(sed -n 's/^pkgver=//p' PKGBUILD)

          install -dm700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/aur'

          git config --global user.name  "$GIT_NAME"
          git config --global user.email "$GIT_EMAIL"

          git clone "ssh://aur@aur.archlinux.org/$AUR_PKG.git" /tmp/aur
          cp PKGBUILD .SRCINFO coredeck.desktop /tmp/aur/
          git -C /tmp/aur checkout -B master
          git -C /tmp/aur add PKGBUILD .SRCINFO coredeck.desktop
          if git -C /tmp/aur diff --cached --quiet; then
            echo "AUR already has this version"
          else
            git -C /tmp/aur commit -m "chore: auto bumped to $ver"
            git -C /tmp/aur push origin HEAD:master
          fi

          unset GIT_SSH_COMMAND
          git add PKGBUILD .SRCINFO
          git commit -m "coredeck-bin $ver"
          git push


  notify-failure:
    # creates issue if workflow fails
    needs: [check, update]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Open an issue unless one is already open
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="AUR update workflow failed"
          if [ -z "$(gh issue list -R "$REPO" --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
            gh issue create -R "$REPO" --title "$title" --body "see $RUN_URL"
          fi


  keepalive:
    # this is a little hack since gitHub disables scheduled workflows after 60 days of without repo activity which would happen if upstream goes quiet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add an empty commit if the last one is over 45 days old
        run: |
          last=$(git log -1 --format=%ct)
          if (( $(date +%s) - last > 45*24*3600 )); then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive"
            git push
          fi
